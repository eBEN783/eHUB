<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eHUB - Abuja's Cheapest Data &amp; Bill Payment</title>
    <meta name="description" content="eHUB is Abuja's cheapest VTU and bills platform for instant data bundles, discounted airtime, AEDC electricity tokens, and TV subscriptions." />
    <meta property="og:title" content="eHUB - Abuja's Cheapest Data &amp; Bill Payment" />
    <meta property="og:description" content="eHUB is Abuja's cheapest VTU and bills platform for instant data bundles, discounted airtime, AEDC electricity tokens, and TV subscriptions." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/aistudio/Bee_concepts_logo_design_3d5073c9.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/assets/aistudio/Bee_concepts_logo_design_3d5073c9.png" />
    <!-- Google Fonts: Sora, Inter, Plus Jakarta Sans, Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Paystack Inline JS -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <!-- Prevent Theme Flash -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('ehub_theme');
          if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#eef5ef] dark:bg-[#060e0a] text-gray-800 dark:text-gray-100 antialiased font-sans transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
